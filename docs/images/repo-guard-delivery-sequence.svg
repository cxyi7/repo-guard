<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1970" viewBox="0 0 1220 1970" role="img" aria-labelledby="title desc">
<title id="title">交付合同：四方协作时序</title><desc id="desc">人确认业务和验收，AI 实现与整理，repo-guard 校验，Git 保存事实。包含首轮技术结果采集、人工验收、最终复核；变化需要重新确认。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647A92"/></marker></defs>
<rect width="1220" height="1970" rx="24" fill="#F5F8FC"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="48" y="56" font-size="30" fill="#152A43" text-anchor="start" font-weight="700">一次交付，四方各司其职</text>
<text x="48" y="92" font-size="18" fill="#52677E" text-anchor="start" font-weight="400">从确认需求到发布就绪 · 技术证据先生成，人工验收后复核</text>
<rect x="30" y="122" width="260" height="83" rx="14" fill="#FFFFFF" stroke="#D8E3EE"/>
<text x="160" y="157" font-size="23" fill="#7451B8" text-anchor="middle" font-weight="700">人</text>
<text x="160" y="185" font-size="16" fill="#52677E" text-anchor="middle" font-weight="400">确认需求 · 验收 · 发布</text>
<path d="M160,207 L160,1830" fill="none" stroke="#647A92" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="320" y="122" width="260" height="83" rx="14" fill="#FFFFFF" stroke="#D8E3EE"/>
<text x="450" y="157" font-size="23" fill="#2463D3" text-anchor="middle" font-weight="700">AI</text>
<text x="450" y="185" font-size="16" fill="#52677E" text-anchor="middle" font-weight="400">规划 · 实现 · 测试 · 整理</text>
<path d="M450,207 L450,1830" fill="none" stroke="#647A92" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="620" y="122" width="260" height="83" rx="14" fill="#FFFFFF" stroke="#D8E3EE"/>
<text x="750" y="157" font-size="23" fill="#157866" text-anchor="middle" font-weight="700">repo-guard</text>
<text x="750" y="185" font-size="16" fill="#52677E" text-anchor="middle" font-weight="400">检查约定 · 复核证据</text>
<path d="M750,207 L750,1830" fill="none" stroke="#647A92" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="920" y="122" width="260" height="83" rx="14" fill="#FFFFFF" stroke="#D8E3EE"/>
<text x="1050" y="157" font-size="23" fill="#52677E" text-anchor="middle" font-weight="700">Git</text>
<text x="1050" y="185" font-size="16" fill="#52677E" text-anchor="middle" font-weight="400">索引 · 提交 · 分支 · 历史</text>
<path d="M1050,207 L1050,1830" fill="none" stroke="#647A92" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="30" y="229" width="1160" height="34" rx="8" fill="#E7EFF9" stroke="none"/>
<text x="48" y="253" font-size="17" fill="#2463D3" text-anchor="start" font-weight="700">01 约定交付</text>
<text x="305.0" y="287" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">提出需求与验收条件</text>
<path d="M160,299 L450,299" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="750.0" y="345" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">保存本地需求、功能登记与合同草稿</text>
<path d="M450,357 L1050,357" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="403" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">校验合同、计算指纹</text>
<path d="M450,415 L750,415" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="900.0" y="461" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">读取索引与历史</text>
<path d="M750,473 L1050,473" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="519" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">返回当前定义与问题</text>
<path d="M750,531 L450,531" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="305.0" y="577" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">确认归属与合同计划</text>
<path d="M160,589 L450,589" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="647" width="1160" height="34" rx="8" fill="#E7EFF9" stroke="none"/>
<text x="48" y="671" font-size="17" fill="#2463D3" text-anchor="start" font-weight="700">02 实现与提交</text>
<text x="750.0" y="705" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">提交实现与测试</text>
<path d="M450,717 L1050,717" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="900.0" y="763" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">触发 pre-commit</text>
<path d="M1050,775 L750,775" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="900.0" y="821" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">通过才继续提交</text>
<path d="M750,833 L1050,833" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="750.0" y="879" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">形成最终代码提交 subjectCommit</text>
<path d="M1050,891 L450,891" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="949" width="1160" height="34" rx="8" fill="#E7EFF9" stroke="none"/>
<text x="48" y="973" font-size="17" fill="#2463D3" text-anchor="start" font-weight="700">03 技术证据与验收</text>
<text x="600.0" y="1007" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">首轮 release-ready</text>
<path d="M450,1019 L750,1019" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="900.0" y="1065" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">核对基线与代码</text>
<path d="M750,1077 L1050,1077" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="1123" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">返回前序检查结果</text>
<path d="M750,1135 L450,1135" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="750.0" y="1181" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">保存 Evidence Run 与真实执行日志</text>
<path d="M450,1193 L1050,1193" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="1239" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">计算技术证据指纹</text>
<path d="M450,1251 L750,1251" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="305.0" y="1297" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">提交当前代码与证据</text>
<path d="M450,1309 L160,1309" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="305.0" y="1355" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">真实验收并确认</text>
<path d="M160,1367 L450,1367" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="1425" width="1160" height="34" rx="8" fill="#E7EFF9" stroke="none"/>
<text x="48" y="1449" font-size="17" fill="#2463D3" text-anchor="start" font-weight="700">04 最终复核与发布决定</text>
<text x="600.0" y="1483" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">重算执行摘要</text>
<path d="M450,1495 L750,1495" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="750.0" y="1541" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">提交验收与证据元数据</text>
<path d="M450,1553 L1050,1553" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="1599" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">最终 release-ready</text>
<path d="M450,1611 L750,1611" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="900.0" y="1657" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">比较基线与提交</text>
<path d="M750,1669 L1050,1669" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="1715" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">比对本轮结果与证据</text>
<path d="M750,1727 L450,1727" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<text x="305.0" y="1773" font-size="18" fill="#152A43" text-anchor="middle" font-weight="400">报告就绪，交由人发布</text>
<path d="M450,1785 L160,1785" fill="none" stroke="#647A92" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1844" width="1140" height="88" rx="14" fill="#FFF8E9" stroke="#EBDCB7"/>
<text x="62" y="1874" font-size="18" fill="#152A43" text-anchor="start" font-weight="400">首轮末尾的证据门禁可因资料未完成而失败，不能据前序结果宣称整体通过。</text>
<text x="62" y="1904" font-size="18" fill="#152A43" text-anchor="start" font-weight="400">代码、定义、目标基线或结果变化 → 更新证据并重新验收。最终通过仅表示发布就绪。</text>
</g></svg>
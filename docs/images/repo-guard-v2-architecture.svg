<text x="30" y="44" fill="#f8fafc" font-size="27" text-anchor="start" font-weight="700">一份团队规范 · 前端、Node 与 Java 分别执行</text>
<text x="30" y="77" fill="#94a3b8" font-size="16" text-anchor="start" font-weight="400">工程检查、应用发布与合同交付分别启用；检查要求由团队显式声明。</text>
<g><rect x="28" y="112" width="728" height="70" rx="9" fill="#0f172a"/><rect x="28" y="112" width="728" height="70" rx="9" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/><text x="48" y="142" fill="#94a3b8" font-size="18" text-anchor="start" font-weight="600">原生 v2 · checks / repository / reporting / ci</text><text x="48" y="166" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">文件与执行共用同一模型；旧配置直接拒绝，不再转换</text></g>
<g><rect x="790" y="112" width="382" height="70" rx="9" fill="#0f172a"/><rect x="790" y="112" width="382" height="70" rx="9" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/><text x="810" y="142" fill="#fbbf24" font-size="18" text-anchor="start" font-weight="600">repo-guard.ops.json</text><text x="810" y="166" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">独立启用 · 以同一 projectId 绑定应用</text></g>
<text x="52" y="248" fill="#e2e8f0" font-size="17" text-anchor="start" font-weight="600">工程质量 · 已实现</text>
<text x="814" y="248" fill="#fbbf24" font-size="17" text-anchor="start" font-weight="600">独立运维 · 显式启用</text>
<g><rect x="52" y="285" width="324" height="90" rx="9" fill="#0f172a"/><rect x="52" y="285" width="324" height="90" rx="9" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="72" y="315" fill="#22d3ee" font-size="18" text-anchor="start" font-weight="600">前端应用 · web</text><text x="72" y="339" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">role: frontend / stack: node</text><text x="72" y="361" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">Vue JavaScript / TypeScript 预设</text></g>
<g><rect x="408" y="285" width="324" height="90" rx="9" fill="#0f172a"/><rect x="408" y="285" width="324" height="90" rx="9" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="428" y="315" fill="#34d399" font-size="18" text-anchor="start" font-weight="600">后端应用 · api</text><text x="428" y="339" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">role: backend / stack: node 或 java</text><text x="428" y="361" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">Node JS / TS 或 Java Maven 预设</text></g>
<g><rect x="52" y="425" width="680" height="90" rx="9" fill="#0f172a"/><rect x="52" y="425" width="680" height="90" rx="9" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/><text x="72" y="455" fill="#94a3b8" font-size="18" text-anchor="start" font-weight="600">orchestration/workspace · 按应用建立执行上下文</text><text x="72" y="479" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">仓库规则执行一次；工具使用应用自己的目录与配置</text><text x="72" y="501" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">Hook 读取索引快照；真实推送核对提交与工作树</text></g>
<g><rect x="52" y="565" width="680" height="108" rx="9" fill="#0f172a"/><rect x="52" y="565" width="680" height="108" rx="9" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/><text x="72" y="595" fill="#fb7185" font-size="18" text-anchor="start" font-weight="600">Registry → 固定执行计划 → Gates</text><text x="72" y="619" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">Node 工具或 Java 检查器 / 架构 / 测试 / 构建</text><text x="72" y="641" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">提交时固定修复与复核顺序，受保护文件检查放在末尾</text><text x="72" y="663" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">按显式技术栈隔离；任一应用失败都不能被掩盖</text></g>
<g><rect x="52" y="723" width="680" height="76" rx="9" fill="#0f172a"/><rect x="52" y="723" width="680" height="76" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="72" y="753" fill="#a78bfa" font-size="18" text-anchor="start" font-weight="600">统一结果 · 人和 AI 使用同一份依据</text><text x="72" y="777" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">中文问题与修复指引 / GateResult / JSON / 按应用隔离的报告</text></g>
<rect x="52" y="839" width="680" height="38" rx="6" fill="#111b30"/>
<text x="392" y="864" fill="#94a3b8" font-size="14" text-anchor="middle" font-weight="400">公共底座：core 契约 · policies 规则 · integrations 工具 · git 快照</text>
<g><rect x="814" y="285" width="334" height="90" rx="9" fill="#0f172a"/><rect x="814" y="285" width="334" height="90" rx="9" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/><text x="834" y="315" fill="#fbbf24" font-size="18" text-anchor="start" font-weight="600">operations · 发布计划</text><text x="834" y="339" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">应用脚本 / 产物路径 / 环境 / 分支</text><text x="834" y="361" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">当前支持 Node 应用，独立配置部署</text></g>
<g><rect x="814" y="425" width="334" height="90" rx="9" fill="#0f172a"/><rect x="814" y="425" width="334" height="90" rx="9" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/><text x="834" y="455" fill="#fbbf24" font-size="18" text-anchor="start" font-weight="600">GitLab 模板生成与检查</text><text x="834" y="479" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">ops plan / ops install</text><text x="834" y="501" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">仅更新当前托管内容；冲突拒绝覆盖</text></g>
<g><rect x="814" y="565" width="334" height="108" rx="9" fill="#0f172a"/><rect x="814" y="565" width="334" height="108" rx="9" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/><text x="834" y="595" fill="#fbbf24" font-size="18" text-anchor="start" font-weight="600">质量 → 构建 → 部署</text><text x="834" y="619" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">调用公共质量 CLI，阻断失败结果</text><text x="834" y="641" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">本应用构建产物必须存在且非空</text><text x="834" y="663" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">部署只接收本应用成功构建的产物</text></g>
<g><rect x="814" y="723" width="334" height="154" rx="9" fill="#0f172a"/><rect x="814" y="723" width="334" height="154" rx="9" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/><text x="834" y="753" fill="#fbbf24" font-size="18" text-anchor="start" font-weight="600">前后端分别管理、分别发布</text><text x="834" y="777" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">独立作业名与环境，互不混用产物</text><text x="834" y="799" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">生产默认手动触发，失败仍会阻断</text><text x="834" y="821" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">运维通知：成功 / 失败 / 取消，显式启用</text><text x="834" y="843" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">分仓不自动触发，不自动联合发布</text></g>
<text x="774" y="615" fill="#fbbf24" font-size="11" text-anchor="middle" font-weight="400">公共 CLI</text>
<rect x="28" y="942" width="1144" height="300" rx="12" fill="#100f24" stroke="#a78bfa"/>

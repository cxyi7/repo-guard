<rect x="637" y="1088" width="16" height="13" rx="3" fill="none" stroke="#94a3b8" stroke-dasharray="3,2"/><text x="663" y="1100" fill="#94a3b8" font-size="13" text-anchor="start" font-weight="400">后续扩展</text>
<text x="1170" y="1100" fill="#64748b" font-size="13" text-anchor="end" font-weight="400">repo-guard 2.0 · 实现结构</text>

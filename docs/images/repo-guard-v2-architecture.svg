<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1130" role="img" aria-labelledby="architecture-title architecture-description">
<title id="architecture-title">repo-guard v2：显式项目、统一工程检查、独立应用发布</title>
<desc id="architecture-description">前端与 Node 后端由人或 AI 显式配置，共用工作区调度、固定门禁计划与结果契约。运维通过独立配置按应用生成 GitLab 质量、构建和部署任务。Java 校验及自动安装仅为后续扩展。</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern></defs>
<style>text { font-family: 'JetBrains Mono', 'Microsoft YaHei', monospace; }</style>
<rect width="1200" height="1130" fill="#020617"/><rect width="1200" height="1130" fill="url(#grid)"/>
<rect x="28" y="222" width="728" height="680" rx="12" fill="#071221" stroke="#334155"/>
<rect x="790" y="222" width="382" height="680" rx="12" fill="#15140f" stroke="#fbbf24" stroke-dasharray="8,4"/>
<path d="M392 182V263H214V283" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrowhead)"/><path d="M392 263H570V283" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M214 375V399H392V423" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowhead)"/><path d="M570 375V399H392V423" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M392 515V563" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowhead)"/><path d="M392 673V721" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M981 182V283" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrowhead)"/><path d="M981 375V423" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrowhead)"/><path d="M981 515V563" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrowhead)"/><path d="M981 673V721" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M814 630H734" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<text x="30" y="44" fill="#f8fafc" font-size="27" text-anchor="start" font-weight="700">一份团队规范 · 前端与 Node 后端分别执行</text>
<text x="30" y="77" fill="#94a3b8" font-size="16" text-anchor="start" font-weight="400">显式声明项目身份，检查通用工程要求；不猜框架，不生成业务验收规则。</text>
<g><rect x="28" y="112" width="728" height="70" rx="9" fill="#0f172a"/><rect x="28" y="112" width="728" height="70" rx="9" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/><text x="48" y="142" fill="#94a3b8" font-size="18" text-anchor="start" font-weight="600">repo-guard.config.json · version: 2</text><text x="48" y="166" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">仓库规则统一维护；每个应用声明 id / role / stack / preset</text></g>
<g><rect x="790" y="112" width="382" height="70" rx="9" fill="#0f172a"/><rect x="790" y="112" width="382" height="70" rx="9" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/><text x="810" y="142" fill="#fbbf24" font-size="18" text-anchor="start" font-weight="600">repo-guard.ops.json</text><text x="810" y="166" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">独立启用 · 以同一 projectId 绑定应用</text></g>
<text x="52" y="248" fill="#e2e8f0" font-size="17" text-anchor="start" font-weight="600">工程质量 · 已实现</text>
<text x="814" y="248" fill="#fbbf24" font-size="17" text-anchor="start" font-weight="600">独立运维 · 显式启用</text>
<g><rect x="52" y="285" width="324" height="90" rx="9" fill="#0f172a"/><rect x="52" y="285" width="324" height="90" rx="9" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="72" y="315" fill="#22d3ee" font-size="18" text-anchor="start" font-weight="600">前端应用 · web</text><text x="72" y="339" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">role: frontend / stack: node</text><text x="72" y="361" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">Vue JavaScript / TypeScript 预设</text></g>
<g><rect x="408" y="285" width="324" height="90" rx="9" fill="#0f172a"/><rect x="408" y="285" width="324" height="90" rx="9" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="428" y="315" fill="#34d399" font-size="18" text-anchor="start" font-weight="600">Node 后端 · api</text><text x="428" y="339" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">role: backend / stack: node</text><text x="428" y="361" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">Node JavaScript / TypeScript 预设</text></g>
<g><rect x="52" y="425" width="680" height="90" rx="9" fill="#0f172a"/><rect x="52" y="425" width="680" height="90" rx="9" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/><text x="72" y="455" fill="#94a3b8" font-size="18" text-anchor="start" font-weight="600">orchestration/workspace · 按应用建立执行上下文</text><text x="72" y="479" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">仓库规则执行一次；工具使用应用自己的目录与配置</text><text x="72" y="501" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">Hook 读取索引快照；真实推送核对提交与工作树</text></g>
<g><rect x="52" y="565" width="680" height="108" rx="9" fill="#0f172a"/><rect x="52" y="565" width="680" height="108" rx="9" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/><text x="72" y="595" fill="#fb7185" font-size="18" text-anchor="start" font-weight="600">Registry → 固定执行计划 → Gates</text><text x="72" y="619" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">ESLint / Prettier / 类型 / 架构 / 测试 / 构建等通用检查</text><text x="72" y="641" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">提交时固定修复与复核顺序，受保护文件检查放在末尾</text><text x="72" y="663" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">Node 后端跳过 Vue 专项；任一应用失败都不能被掩盖</text></g>
<g><rect x="52" y="723" width="680" height="76" rx="9" fill="#0f172a"/><rect x="52" y="723" width="680" height="76" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="72" y="753" fill="#a78bfa" font-size="18" text-anchor="start" font-weight="600">统一结果 · 人和 AI 使用同一份依据</text><text x="72" y="777" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">中文问题与修复指引 / GateResult / JSON / 按应用隔离的报告</text></g>
<rect x="52" y="839" width="680" height="38" rx="6" fill="#111b30"/>
<text x="392" y="864" fill="#94a3b8" font-size="14" text-anchor="middle" font-weight="400">公共底座：core 契约 · policies 规则 · integrations 工具 · git 快照</text>
<g><rect x="814" y="285" width="334" height="90" rx="9" fill="#0f172a"/><rect x="814" y="285" width="334" height="90" rx="9" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/><text x="834" y="315" fill="#fbbf24" font-size="18" text-anchor="start" font-weight="600">operations · 发布计划</text><text x="834" y="339" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">应用脚本 / 产物路径 / 环境 / 分支</text><text x="834" y="361" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">不根据前后端类型推断部署方式</text></g>
<g><rect x="814" y="425" width="334" height="90" rx="9" fill="#0f172a"/><rect x="814" y="425" width="334" height="90" rx="9" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/><text x="834" y="455" fill="#fbbf24" font-size="18" text-anchor="start" font-weight="600">GitLab 模板生成与检查</text><text x="834" y="479" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">ops plan / ops install</text><text x="834" y="501" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">保留已有根流水线，按需合并引用</text></g>
<g><rect x="814" y="565" width="334" height="108" rx="9" fill="#0f172a"/><rect x="814" y="565" width="334" height="108" rx="9" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/><text x="834" y="595" fill="#fbbf24" font-size="18" text-anchor="start" font-weight="600">质量 → 构建 → 部署</text><text x="834" y="619" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">调用公共质量 CLI，阻断失败结果</text><text x="834" y="641" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">本应用构建产物必须存在且非空</text><text x="834" y="663" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">部署只接收本应用成功构建的产物</text></g>
<g><rect x="814" y="723" width="334" height="154" rx="9" fill="#0f172a"/><rect x="814" y="723" width="334" height="154" rx="9" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/><text x="834" y="753" fill="#fbbf24" font-size="18" text-anchor="start" font-weight="600">前后端分别管理、分别发布</text><text x="834" y="777" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">独立作业名与环境，互不混用产物</text><text x="834" y="799" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">生产默认手动触发，失败仍会阻断</text><text x="834" y="821" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">工具、依赖及部署脚本由项目准备</text><text x="834" y="843" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">分仓不自动触发，不自动联合发布</text></g>
<text x="774" y="615" fill="#fbbf24" font-size="11" text-anchor="middle" font-weight="400">公共 CLI</text>
<rect x="28" y="942" width="1144" height="120" rx="12" fill="#0b1020" stroke="#64748b" stroke-dasharray="6,5"/>
<text x="52" y="970" fill="#94a3b8" font-size="17" text-anchor="start" font-weight="600">后续扩展 · 当前不会自动执行</text>
<text x="52" y="1001" fill="#cbd5e1" font-size="17" text-anchor="start" font-weight="600">Java 校验</text><text x="52" y="1029" fill="#94a3b8" font-size="14" text-anchor="start" font-weight="400">预留 java-maven / java-gradle；需要 Node 宿主 + JDK</text>
<text x="658" y="1001" fill="#cbd5e1" font-size="17" text-anchor="start" font-weight="600">自动接入 provisioning</text><text x="658" y="1029" fill="#94a3b8" font-size="14" text-anchor="start" font-weight="400">预设已声明工具需求；安装、配置、就绪验证待实现</text>

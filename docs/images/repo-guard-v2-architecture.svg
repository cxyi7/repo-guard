<rect x="193" y="1088" width="16" height="13" rx="3" fill="#064e3b" stroke="#34d399"/><text x="219" y="1100" fill="#94a3b8" font-size="13" text-anchor="start" font-weight="400">Node 后端</text>
<rect x="346" y="1088" width="16" height="13" rx="3" fill="#881337" stroke="#fb7185"/><text x="372" y="1100" fill="#94a3b8" font-size="13" text-anchor="start" font-weight="400">工程门禁</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510" role="img" aria-labelledby="architecture-title architecture-description">
<title id="architecture-title">repo-guard v2：显式项目、统一工程检查、独立运维与交付协作</title>
<desc id="architecture-description">前端、Node 后端与 Java Maven 后端由人或 AI 显式配置，共用工作区调度、固定门禁计划与结果契约。运维通过独立配置按应用生成 GitLab 质量、构建和部署任务。独立交付从共同合同绑定，经工程 Gate 或命令生成签名证据，支持跨仓交换、联合验证与人工验收。Java Maven 已接入 18 项独立检查；Gradle、Java 运维、自动接入 provisioning 及跨仓自动协调发布尚未实现。</desc>

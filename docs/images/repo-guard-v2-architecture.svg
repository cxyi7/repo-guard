<text x="52" y="970" fill="#a78bfa" font-size="17" text-anchor="start" font-weight="600">独立交付 · 已实现 · 显式启用</text>
<text x="52" y="1000" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">同仓多应用或不同仓库共享已确认合同；各参与方保留自己的工程配置与工作分支。</text>
<g><rect x="52" y="1040" width="244" height="122" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="72" y="1070" fill="#a78bfa" font-size="17" text-anchor="start" font-weight="600">独立绑定</text><text x="72" y="1094" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">人确认共同合同修订</text><text x="72" y="1116" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">各方绑定本仓参与者</text><text x="72" y="1138" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">repo-guard.delivery.json</text></g>
<g><rect x="326" y="1040" width="244" height="122" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="346" y="1070" fill="#a78bfa" font-size="17" text-anchor="start" font-weight="600">工程 Gate 或命令</text><text x="346" y="1094" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">复用工程 Gate 执行入口</text><text x="346" y="1116" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">或运行团队已有检查命令</text><text x="346" y="1138" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">合同不要求 Node 工程预设</text></g>
<g><rect x="600" y="1040" width="244" height="122" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="620" y="1070" fill="#a78bfa" font-size="17" text-anchor="start" font-weight="600">生成签名证据</text><text x="620" y="1094" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">绑定合同修订与代码提交</text><text x="620" y="1116" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">记录检查结果与证据指纹</text><text x="620" y="1138" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">失败与跳过不能成为通过证据</text></g>
<g><rect x="874" y="1040" width="274" height="122" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="894" y="1070" fill="#a78bfa" font-size="17" text-anchor="start" font-weight="600">交换、联合验证与验收</text><text x="894" y="1094" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">同仓汇总 / 跨仓导出与导入</text><text x="894" y="1116" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">联合验证通过 → 人工验收</text><text x="894" y="1138" fill="#cbd5e1" font-size="14" text-anchor="start" font-weight="400">证据变化使旧验证与验收失效</text></g>
<text x="600" y="1216" fill="#94a3b8" font-size="14" text-anchor="middle" font-weight="400">执行与存储：orchestration/delivery · 合同策略与签名：policies/delivery-contract · 公共结果：core</text>
<rect x="28" y="1282" width="1144" height="154" rx="12" fill="#0b1020" stroke="#64748b" stroke-dasharray="6,5"/>
<text x="52" y="1310" fill="#94a3b8" font-size="17" text-anchor="start" font-weight="600">后续扩展 · 当前尚未实现</text>
<text x="52" y="1341" fill="#cbd5e1" font-size="17" text-anchor="start" font-weight="600">Java 后续能力</text><text x="52" y="1369" fill="#94a3b8" font-size="14" text-anchor="start" font-weight="400">Gradle 工程预设与 Java 运维发布待扩展</text>
<text x="658" y="1341" fill="#cbd5e1" font-size="17" text-anchor="start" font-weight="600">自动接入 provisioning</text><text x="658" y="1369" fill="#94a3b8" font-size="14" text-anchor="start" font-weight="400">预设已声明工具需求；安装、配置、就绪验证待实现</text>
<text x="52" y="1413" fill="#94a3b8" font-size="14" text-anchor="start" font-weight="400">跨仓自动协调发布尚未实现；现有交付协议交换签名证据，不自动触发其他仓库部署。</text>

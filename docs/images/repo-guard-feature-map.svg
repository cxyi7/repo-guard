<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="398" viewBox="0 0 1200 398" role="img" aria-labelledby="title desc">
  <title id="title">完整交付闭环：需求、开发、测试、发布、反馈、反向升级</title>
  <desc id="desc">需求 → 开发 → 测试 → 发布 → 反馈 → 反向升级。团队评估并确认改进需求、设计、测试或规则，再进入下一轮。反馈也可以来自测试阶段。repo-guard 检查约定与证据，团队执行验收、发布和升级决定。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1200" height="398" rx="16" fill="#f8fafc"/>
  <text x="44" y="56" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#172b41" text-anchor="start">从需求出发，把反馈带回下一轮</text><text x="1156" y="54" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#54657a" text-anchor="end">完整交付闭环</text><path d="M 157 139 H 259" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="110" cy="139" r="35" fill="white" stroke="#dbe3ed"/><g transform="translate(110 139)"><path d="M -12 -16 H 7 L 14 -9 V 17 H -12 Z M 6 -16 V -8 H 14 M -5 0 H 6 M -5 7 H 6" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="110" y="210" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="600" fill="#172b41" text-anchor="middle">需求</text><text x="110" y="244" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#54657a" text-anchor="middle">明确目标</text><path d="M 353 139 H 455" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="306" cy="139" r="35" fill="white" stroke="#dbe3ed"/><g transform="translate(306 139)"><path d="M -8 -10 L -18 0 L -8 10 M 8 -10 L 18 0 L 8 10 M 4 -15 L -4 15" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="306" y="210" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="600" fill="#172b41" text-anchor="middle">开发</text><text x="306" y="244" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#54657a" text-anchor="middle">按约定实现</text><path d="M 549 139 H 651" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="502" cy="139" r="35" fill="white" stroke="#dbe3ed"/><g transform="translate(502 139)"><path d="M -14 -14 H 14 V 16 H -14 Z M -8 -2 L -3 3 L 7 -7 M -6 10 H 7" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="502" y="210" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="600" fill="#172b41" text-anchor="middle">测试</text><text x="502" y="244" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#54657a" text-anchor="middle">验证与验收</text><path d="M 745 139 H 847" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="698" cy="139" r="35" fill="white" stroke="#dbe3ed"/><g transform="translate(698 139)"><path d="M 0 7 V -17 M -9 -8 L 0 -17 L 9 -8 M -16 3 V 16 H 16 V 3" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="698" y="210" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="600" fill="#172b41" text-anchor="middle">发布</text><text x="698" y="244" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#54657a" text-anchor="middle">复核后发布</text><path d="M 941 139 H 1043" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="894" cy="139" r="35" fill="white" stroke="#dbe3ed"/><g transform="translate(894 139)"><path d="M -17 -13 H 17 V 10 H -5 L -13 18 V 10 H -17 Z M -9 -5 H 9 M -9 2 H 4" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="894" y="210" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="600" fill="#172b41" text-anchor="middle">反馈</text><text x="894" y="244" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#54657a" text-anchor="middle">记录真实问题</text><circle cx="1090" cy="139" r="35" fill="white" stroke="#dbe3ed"/><g transform="translate(1090 139)"><path d="M -16 -3 A 17 17 0 0 1 13 -11 M 6 -13 L 14 -10 L 14 -18 M 16 3 A 17 17 0 0 1 -13 11 M -6 13 L -14 10 L -14 18" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1090" y="210" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="600" fill="#172b41" text-anchor="middle">反向升级</text><text x="1090" y="244" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#54657a" text-anchor="middle">完善约定</text><path d="M 1090 267 V 294 Q 1090 310 1074 310 H 126 Q 110 310 110 294 V 267" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="334" y="289" width="532" height="40" rx="0" fill="#f8fafc" stroke="none"/><text x="600" y="316" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#2563eb" text-anchor="middle">需求更清楚 · 测试更完整 · 规范更可靠</text><text x="600" y="368" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#54657a" text-anchor="middle">团队确认改进方向，repo-guard 检查约定与证据。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
<title id="title">repo-guard 工作模型</title><desc id="desc">可信事实是统一判断的依据，生命周期编排负责建立上下文和调度能力，最终形成可复核输出。此图展示职责关系，具体执行顺序由固定计划定义。</desc>
<style>text { font-family: 'JetBrains Mono', 'Microsoft YaHei', 'PingFang SC', monospace; }</style>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#93a6bf"/></marker></defs>
<rect width="1280" height="650" rx="18" fill="#020617"/><rect width="1280" height="650" rx="18" fill="url(#grid)"/>
<text x="40" y="43" font-size="17" fill="#22d3ee" font-weight="600" text-anchor="start">repo-guard  /  内部工作模型</text>
<text x="40" y="98" font-size="36" fill="#eaf0fa" font-weight="700" text-anchor="start">多个入口，共用判断和结果。</text>
<text x="40" y="138" font-size="19" fill="#a8b5ca" font-weight="400" text-anchor="start">入口建立上下文并选择计划，门禁复用事实、策略与工具适配，形成统一结论。</text>
<path d="M316 352H344" fill="none" stroke="#93a6bf" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M624 352H652" fill="none" stroke="#93a6bf" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M932 352H960" fill="none" stroke="#93a6bf" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="184" width="276" height="334" rx="12" fill="#0b1426" stroke="#a78bfa" stroke-width="1.5"/>
<text x="60" y="224" font-size="25" fill="#a78bfa" font-weight="700" text-anchor="start">可信事实</text>
<text x="60" y="253" font-size="16" fill="#a8b5ca" font-weight="400" text-anchor="start">明确本次检查的对象</text>
<rect x="56" y="282" width="244" height="82" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="70" y="313" font-size="18" fill="#eaf0fa" font-weight="600" text-anchor="start">配置与 Git</text>
<text x="70" y="340" font-size="14" fill="#a8b5ca" font-weight="400" text-anchor="start">启用项、路径、暂存与 revision</text>
<rect x="56" y="408" width="244" height="82" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="70" y="439" font-size="18" fill="#eaf0fa" font-weight="600" text-anchor="start">项目工具与交付资料</text>
<text x="70" y="466" font-size="14" fill="#a8b5ca" font-weight="400" text-anchor="start">工具输出、合同和执行证据</text>
<rect x="348" y="184" width="276" height="334" rx="12" fill="#0b1426" stroke="#22d3ee" stroke-width="1.5"/>
<text x="368" y="224" font-size="25" fill="#22d3ee" font-weight="700" text-anchor="start">生命周期编排</text>
<text x="368" y="253" font-size="16" fill="#a8b5ca" font-weight="400" text-anchor="start">明确何时、按什么顺序执行</text>
<rect x="364" y="282" width="244" height="82" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="378" y="313" font-size="18" fill="#eaf0fa" font-weight="600" text-anchor="start">CLI / Hook / CI</text>
<text x="378" y="340" font-size="14" fill="#a8b5ca" font-weight="400" text-anchor="start">建立 GateContext 与变更范围</text>
<rect x="364" y="408" width="244" height="82" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="378" y="439" font-size="18" fill="#eaf0fa" font-weight="600" text-anchor="start">能力目录与执行计划</text>
<text x="378" y="466" font-size="14" fill="#a8b5ca" font-weight="400" text-anchor="start">Registry / Execution Plan</text>
<rect x="656" y="184" width="276" height="334" rx="12" fill="#0b1426" stroke="#34d399" stroke-width="1.5"/>
<text x="676" y="224" font-size="25" fill="#34d399" font-weight="700" text-anchor="start">统一判断</text>
<text x="676" y="253" font-size="16" fill="#a8b5ca" font-weight="400" text-anchor="start">明确是否满足工程约定</text>
<rect x="672" y="282" width="244" height="82" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="686" y="313" font-size="18" fill="#eaf0fa" font-weight="600" text-anchor="start">策略判断与工具适配</text>
<text x="686" y="340" font-size="14" fill="#a8b5ca" font-weight="400" text-anchor="start">Policies / Integrations</text>
<rect x="672" y="408" width="244" height="82" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="686" y="439" font-size="18" fill="#eaf0fa" font-weight="600" text-anchor="start">Gate Contract</text>
<text x="686" y="466" font-size="14" fill="#a8b5ca" font-weight="400" text-anchor="start">组合事实，形成 GateResult</text>
<rect x="964" y="184" width="276" height="334" rx="12" fill="#0b1426" stroke="#fbbf24" stroke-width="1.5"/>
<text x="984" y="224" font-size="25" fill="#fbbf24" font-weight="700" text-anchor="start">可复核输出</text>
<text x="984" y="253" font-size="16" fill="#a8b5ca" font-weight="400" text-anchor="start">让结论可读、可追踪</text>
<rect x="980" y="282" width="244" height="82" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="994" y="313" font-size="18" fill="#eaf0fa" font-weight="600" text-anchor="start">给开发者与评审者</text>
<text x="994" y="340" font-size="14" fill="#a8b5ca" font-weight="400" text-anchor="start">中文结论、问题与修复指引</text>
<rect x="980" y="408" width="244" height="82" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="994" y="439" font-size="18" fill="#eaf0fa" font-weight="600" text-anchor="start">给自动化与验收流程</text>
<text x="994" y="466" font-size="14" fill="#a8b5ca" font-weight="400" text-anchor="start">JSON、产物与 Evidence Run</text>
<rect x="40" y="558" width="1200" height="48" rx="8" fill="#10212a" stroke="#245453" stroke-width="1.5"/>
<text x="640" y="588" font-size="18" fill="#34d399" font-weight="400" text-anchor="middle">core 提供稳定契约；事实、策略、工具适配、门禁与编排分别维护，各层边界由测试约束。</text>
<text x="40" y="634" font-size="14" fill="#a8b5ca" font-weight="400" text-anchor="start">箭头表示职责衔接，不代表模块之间可以任意导入。</text>
<text x="1240" y="634" font-size="14" fill="#a8b5ca" font-weight="400" text-anchor="end">详细依赖方向见项目总览第 5.4 节</text>
</svg>

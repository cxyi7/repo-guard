<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="444" viewBox="0 0 1200 444" role="img" aria-labelledby="title desc">
  <title id="title">路径命名规则的配置与启停</title>
  <desc id="desc">在 repo-guard.config.json 中将 checks.pathNaming 配置为 camelCase，检查 src/**，排除 src/generated/**。enable pathNaming 启用，disable pathNaming 关闭；命令同步托管规范。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1200" height="444" rx="16" fill="#f8fafc"/>
  <text x="44" y="56" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#172b41" text-anchor="start">把团队约定，变成可执行的配置</text><text x="1156" y="54" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#54657a" text-anchor="end">规则配置</text><rect x="44" y="90" width="586" height="282" rx="12" fill="white" stroke="#dbe3ed"/><text x="70" y="124" font-family="Consolas, Microsoft YaHei, monospace" font-size="20" font-weight="600" fill="#172b41" text-anchor="start">repo-guard.config.json</text><path d="M 44 143 H 630" fill="none" stroke="#dbe3ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="175" font-family="Consolas, Microsoft YaHei, monospace" font-size="19" font-weight="400" fill="#54657a" text-anchor="start">checks.pathNaming</text><text x="88" y="217" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#172b41" text-anchor="start">enabled</text><text x="268" y="217" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#2563eb" text-anchor="start">true</text><text x="88" y="256" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#172b41" text-anchor="start">convention</text><text x="268" y="256" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#2563eb" text-anchor="start">&quot;camelCase&quot;</text><text x="88" y="295" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#172b41" text-anchor="start">include</text><text x="268" y="295" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#2563eb" text-anchor="start">[&quot;src/**&quot;]</text><text x="88" y="334" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#172b41" text-anchor="start">exclude</text><text x="268" y="334" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#2563eb" text-anchor="start">[&quot;src/generated/**&quot;]</text><path d="M 651 231 H 696" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="735" y="125" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="600" fill="#172b41" text-anchor="start">同一条规则，两种状态</text><rect x="735" y="159" width="58" height="30" rx="15" fill="#2563eb" stroke="none"/><circle cx="778" cy="174" r="11" fill="white"/><text x="812" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#172b41" text-anchor="start">启用：执行命名检查</text><text x="735" y="226" font-family="Consolas, Microsoft YaHei, monospace" font-size="19" font-weight="400" fill="#54657a" text-anchor="start">npx repo-guard enable pathNaming</text><rect x="735" y="270" width="58" height="30" rx="15" fill="#c9d3df" stroke="none"/><circle cx="750" cy="285" r="11" fill="white"/><text x="812" y="293" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#172b41" text-anchor="start">关闭：跳过命名检查</text><text x="735" y="337" font-family="Consolas, Microsoft YaHei, monospace" font-size="19" font-weight="400" fill="#54657a" text-anchor="start">npx repo-guard disable pathNaming</text><text x="44" y="414" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#54657a" text-anchor="start">启停命令同时同步 AGENTS.md 中的团队规范。</text>
</svg>

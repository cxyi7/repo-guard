<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="566" viewBox="0 0 1200 566" role="img" aria-labelledby="title desc">
  <title id="title">路径命名检查的真实提交演示</title>
  <desc id="desc">独立演示仓库的 Git Hook 日志节选。src/user_info.js 违反 camelCase 规范，首次 git commit 退出码为 1；改为 src/userInfo.js 并重新暂存后，命名检查与提交成功，退出码为 0。日志经过排版，不是原始终端截图。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1200" height="566" rx="16" fill="#f8fafc"/>
  <text x="44" y="56" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#172b41" text-anchor="start">一次提交，看到问题与修复结果</text><text x="1156" y="54" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#54657a" text-anchor="end">真实运行 · 日志节选</text><rect x="44" y="88" width="1112" height="174" rx="12" fill="white" stroke="#dbe3ed"/><text x="68" y="124" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="600" fill="#172b41" text-anchor="start">01  首次提交</text><text x="1132" y="124" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#b42318" text-anchor="end">未通过</text><path d="M 68 143 H 1132" fill="none" stroke="#dbe3ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="68" y="176" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#172b41" text-anchor="start">位置: src/user_info.js</text><text x="68" y="207" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#172b41" text-anchor="start">问题: 文件名 user_info 不符合项目统一的 camelCase 规范</text><text x="68" y="238" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#b42318" text-anchor="start">未通过  repository.path-naming</text><path d="M 74 278 V 308" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="101" y="302" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#54657a" text-anchor="start">重命名并重新暂存：src/user_info.js → src/userInfo.js</text><rect x="44" y="329" width="1112" height="174" rx="12" fill="white" stroke="#dbe3ed"/><text x="68" y="365" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="600" fill="#172b41" text-anchor="start">02  修正后再次提交</text><text x="1132" y="365" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#157347" text-anchor="end">通过</text><path d="M 68 384 H 1132" fill="none" stroke="#dbe3ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="68" y="417" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#172b41" text-anchor="start">1 个文件和 1 个目录通过统一命名检查</text><text x="68" y="448" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#157347" text-anchor="start">通过  repository.path-naming</text><text x="68" y="479" font-family="Consolas, Microsoft YaHei, monospace" font-size="21" font-weight="400" fill="#172b41" text-anchor="start">create mode 100644 src/userInfo.js</text><text x="44" y="539" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#54657a" text-anchor="start">演示配置：camelCase 路径命名已启用；ESLint、Prettier、Stylelint 未启用。</text>
</svg>
